name: Dashboard PNG
version: "1.1.0"
slug: dashboard_png
description: Manage multiple dashboard PNGs, rotations, and time-of-day schedules.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8099
ingress_entry: index.html
panel_icon: mdi:view-dashboard
panel_title: Dashboard PNG
panel_admin: true
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
# Existing options initialize the Default dashboard once on upgrade.
# Thereafter, manage profiles and schedules with Open Web UI.
options:
  source: /homeassistant/dashboard/dashboard.html
  base_url: http://homeassistant:8123
  width: 1600
  height: 1200
  filename: dashboard.png
  interval_seconds: 300
  render_delay_ms: 2000
  timeout_seconds: 60
  ready_selector: ""
  timezone: America/Toronto
schema:
  source: str
  base_url: url
  width: int(1,8192)
  height: int(1,8192)
  filename: 'match(^[A-Za-z0-9][A-Za-z0-9._-]*\.png$)'
  interval_seconds: int(10,86400)
  render_delay_ms: int(0,60000)
  timeout_seconds: int(5,300)
  ready_selector: str
  timezone: str
