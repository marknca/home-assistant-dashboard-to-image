name: Dashboard PNG
version: "1.0.2"
slug: dashboard_png
description: Render an HTML dashboard to a fixed-size PNG on a schedule.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 30
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  source: /homeassistant/dashboard/dashboard.html
  base_url: http://homeassistant:8123
  width: 1600
  height: 1200
  filename: dashboard.png
  interval_seconds: 300
  render_delay_ms: 2000
  timeout_seconds: 60
  ready_selector: ""
  timezone: America/Toronto
schema:
  source: str
  base_url: url
  width: int(1,8192)
  height: int(1,8192)
  filename: 'match(^[A-Za-z0-9][A-Za-z0-9._-]*\.png$)'
  interval_seconds: int(10,86400)
  render_delay_ms: int(0,60000)
  timeout_seconds: int(5,300)
  ready_selector: str
  timezone: str
